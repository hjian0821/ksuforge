name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.25.x"
  WAILS_VERSION: "v2.15.0"

jobs:
  metadata:
    name: Prepare release metadata
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
      tag: ${{ steps.version.outputs.tag }}
      title: ${{ steps.version.outputs.title }}
      nightly: ${{ steps.version.outputs.nightly }}

    steps:
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_REF_NAME" == "main" ]]; then
            echo "value=nightly" >> "$GITHUB_OUTPUT"
            echo "tag=nightly" >> "$GITHUB_OUTPUT"
            echo "title=Nightly build" >> "$GITHUB_OUTPUT"
            echo "nightly=true" >> "$GITHUB_OUTPUT"
          else
            if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
              echo "Release tag must be semantic, for example v1.2.3" >&2
              exit 1
            fi
            echo "value=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "title=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "nightly=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            goos: darwin
            goarch: arm64
            wails_flags: "-platform darwin/arm64"
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            wails_flags: "-platform darwin/amd64"
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
            wails_flags: "-platform linux/amd64 -tags webkit2_41"
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            wails_flags: "-platform linux/arm64 -tags webkit2_41"
          - runner: windows-2025
            goos: windows
            goarch: amd64
            wails_flags: "-platform windows/amd64"
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Linux build dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install GNU Make on Windows
        if: matrix.goos == 'windows'
        shell: pwsh
        run: choco install make --yes --no-progress

      - name: Install Wails
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}

      - name: Build and package
        shell: bash
        run: >-
          make release
          VERSION="${{ needs.metadata.outputs.version }}"
          GOOS="${{ matrix.goos }}"
          GOARCH="${{ matrix.goarch }}"
          WAILS_FLAGS="${{ matrix.wails_flags }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ksuforge-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            bin/ksuforge_*.tar.gz
            bin/ksuforge_*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs:
      - metadata
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ksuforge-*
          path: bin
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: cd bin && sha256sum ksuforge_* > checksums.txt

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_TITLE: ${{ needs.metadata.outputs.title }}
          IS_NIGHTLY: ${{ needs.metadata.outputs.nightly }}
        run: |
          if [[ "$IS_NIGHTLY" == "true" ]]; then
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$RELEASE_TAG" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY"
            elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG"
            fi
            gh release create "$RELEASE_TAG" bin/* \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --notes "Automated build from main commit $GITHUB_SHA." \
              --prerelease \
              --latest=false \
              --repo "$GITHUB_REPOSITORY"
          elif gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" bin/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            flags=(--verify-tag --generate-notes --title "$RELEASE_TITLE" --repo "$GITHUB_REPOSITORY")
            if [[ "$VERSION" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" bin/* "${flags[@]}"
          fi
